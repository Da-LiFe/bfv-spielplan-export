[project]
name = "spielplan"
version = "0.1.0"
description = "Fetch BFV match schedules and generate HTML/PDF overviews"
requires-python = ">=3.12"
dependencies = [
    "reportlab",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["BLE", "DTZ", "E501", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["test/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 0

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = false
follow_imports = "skip"
ignore_missing_imports = true
